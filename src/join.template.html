<body data-lang-root>
<a class="skip" href="#steps" data-t="s1t"></a>
<header class="hd"><div class="hd-in">
  <a class="logo" href="index.html" aria-label="주유소를부탁해"><svg viewBox="100 40 312 420" aria-hidden="true"><defs><linearGradient id="lg" x1="150" y1="90" x2="370" y2="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0a5651"/><stop offset=".55" stop-color="#0f766e"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><g fill="none" stroke="url(#lg)" stroke-linecap="round" stroke-linejoin="round"><path d="M256 82c-56 80-112 134-112 200a112 112 0 0 0 224 0c0-66-56-120-112-200z" stroke-width="40"/><path d="M200 292a58 58 0 0 0 54 48" stroke-width="32"/></g></svg><span>주유소를부탁해</span></a>
  <label class="lang"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
    <select id="lang" data-aria="langLabel"><option value="ko" selected>한국어</option><option value="en">English</option><option value="th">ไทย</option><option value="zh">简体中文</option><option value="hi">हिन्दी</option></select></label>
</div></header>

<main>
<section class="hero"><div class="wrap">
  <h1 data-t="h1"></h1>
  <div class="gmail" role="note">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/></svg>
    <div><b data-t="gm"></b><span data-t="gmD"></span></div>
  </div>
  <div class="iab" id="iab" role="alert" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
    <div><b data-t="iabT"></b><span data-t="iabD"></span>
      <div class="iabrow"><a class="btn" id="iabOpen" href="#" data-t="iabB"></a><button type="button" class="btn ghost" id="iabCopy" data-t="iabC"></button></div>
      <small id="iabNote" aria-live="polite"></small></div>
  </div>
  <div class="prog"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><p id="progTxt" aria-live="polite"></p></div>
</div></section>

<section class="wrap steps" id="steps">
  <ol class="cards" data-stagger>
    <li class="card" id="c1" data-step="1">
      <div class="phone" aria-hidden="true">
        <svg viewBox="0 0 120 168" focusable="false"><rect x="4" y="2" width="112" height="164" rx="16" fill="#fff" stroke="#17302d" stroke-width="3"/><rect x="46" y="6" width="28" height="4" rx="2" fill="#17302d" opacity=".85"/>
          <rect x="12" y="16" width="96" height="16" rx="8" fill="#e6f4f2"/><circle cx="22" cy="24" r="4" fill="#7fd0c5"/><rect x="30" y="22" width="40" height="4" rx="2" fill="#a9ddd5"/>
          <circle cx="44" cy="54" r="9" fill="#bfe6df"/><circle cx="60" cy="50" r="11" fill="#7fd0c5"/><circle cx="77" cy="54" r="9" fill="#bfe6df"/><path d="M40 70c2-7 8-9 12-9s7 1 8 3c1-2 4-3 8-3s10 2 12 9" fill="none" stroke="#14b8a6" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="28" y="78" width="64" height="5" rx="2.5" fill="#d9e6e3"/><rect x="12" y="96" width="96" height="40" rx="11" fill="#d3efea" stroke="#0c635c" stroke-width="2.4" stroke-dasharray="5 3.5"/>
          <rect x="28" y="146" width="64" height="4" rx="2" fill="#e8efee"/><rect x="38" y="154" width="44" height="4" rx="2" fill="#f0f4f3"/>
          <g class="tap"><circle class="ring" cx="98" cy="132" r="9" fill="none" stroke="#0c635c" stroke-width="2.4"/><circle cx="98" cy="132" r="5" fill="#0c635c"/></g></svg>
        <div class="lbl"><b data-t="s1l"></b><small data-t="s1e"></small></div>
      </div>
      <div class="body">
        <div class="head"><button class="num" type="button" data-press data-chk="1"><span>1</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><h2 data-t="s1t"></h2><em class="chip" data-t="gmShort"></em></div>
        <p class="desc" data-t="s1d"></p>
        <a class="btn" data-press data-ripple data-go="1" href="{{groupUrl}}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg><span data-t="s1b"></span></a>
      </div>
    </li>
    <li class="card" id="c2" data-step="2"{{lock}}>
      <div class="phone" aria-hidden="true">
        <svg viewBox="0 0 120 168" focusable="false"><rect x="4" y="2" width="112" height="164" rx="16" fill="#fff" stroke="#17302d" stroke-width="3"/><rect x="46" y="6" width="28" height="4" rx="2" fill="#17302d" opacity=".85"/>
          <rect x="12" y="16" width="96" height="16" rx="8" fill="#e6f4f2"/><rect x="30" y="22" width="40" height="4" rx="2" fill="#a9ddd5"/><circle cx="22" cy="24" r="4" fill="#7fd0c5"/>
          <rect x="46" y="38" width="28" height="28" rx="8" fill="#0c635c"/><path d="M54 46v12l11-6z" fill="#fff"/>
          <rect x="28" y="72" width="64" height="5" rx="2.5" fill="#d9e6e3"/><rect x="38" y="82" width="44" height="4" rx="2" fill="#e8efee"/>
          <rect x="12" y="96" width="96" height="40" rx="11" fill="#d3efea" stroke="#0c635c" stroke-width="2.4" stroke-dasharray="5 3.5"/>
          <rect x="28" y="146" width="64" height="4" rx="2" fill="#e8efee"/><rect x="38" y="154" width="44" height="4" rx="2" fill="#f0f4f3"/>
          <g class="tap"><circle class="ring" cx="98" cy="132" r="9" fill="none" stroke="#0c635c" stroke-width="2.4"/><circle cx="98" cy="132" r="5" fill="#0c635c"/></g></svg>
        <div class="lbl"><b data-t="s2l"></b><small data-t="s2e"></small></div>
      </div>
      <div class="body">
        <div class="head"><button class="num" type="button" data-press data-chk="2"><span>2</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><h2 data-t="s2t"></h2><em class="chip" data-t="gmShort"></em></div>
        <p class="desc" data-t="s2d"></p>
        <a class="btn" data-press data-ripple data-go="2" href="{{optInUrl}}"{{lockA}} target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg><span data-t="s2b"></span></a>
      </div>
    </li>
    <li class="card" id="c3" data-step="3"{{lock}}>
      <div class="phone" aria-hidden="true">
        <svg viewBox="0 0 120 168" focusable="false"><rect x="4" y="2" width="112" height="164" rx="16" fill="#fff" stroke="#17302d" stroke-width="3"/><rect x="46" y="6" width="28" height="4" rx="2" fill="#17302d" opacity=".85"/>
          <rect x="12" y="16" width="96" height="16" rx="8" fill="#e6f4f2"/><rect x="30" y="22" width="40" height="4" rx="2" fill="#a9ddd5"/><circle cx="22" cy="24" r="4" fill="#7fd0c5"/>
          <rect x="40" y="36" width="40" height="40" rx="11" fill="#fff" stroke="#d7e6e3" stroke-width="2"/><g transform="translate(60 56) scale(.1) translate(-256 -260)" fill="none" stroke="#0f766e" stroke-linecap="round" stroke-linejoin="round"><path d="M256 82c-56 80-112 134-112 200a112 112 0 0 0 224 0c0-66-56-120-112-200z" stroke-width="44"/></g>
          <rect x="28" y="82" width="64" height="5" rx="2.5" fill="#d9e6e3"/><rect x="12" y="96" width="96" height="40" rx="11" fill="#0c635c" stroke="#0c635c" stroke-width="2.4"/>
          <rect x="28" y="146" width="64" height="4" rx="2" fill="#e8efee"/><rect x="38" y="154" width="44" height="4" rx="2" fill="#f0f4f3"/>
          <g class="tap"><circle class="ring" cx="98" cy="132" r="9" fill="none" stroke="#f0705f" stroke-width="2.4"/><circle cx="98" cy="132" r="5" fill="#f0705f"/></g></svg>
        <div class="lbl on-dark"><b data-t="s3l"></b><small data-t="s3e"></small></div>
      </div>
      <div class="body">
        <div class="head"><button class="num" type="button" data-press data-chk="3"><span>3</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><h2 data-t="s3t"></h2><em class="chip" data-t="gmShort"></em></div>
        <p class="desc" data-t="s3d"></p>
        <a class="btn play" data-press data-ripple data-go="3" href="{{installUrl}}"{{lockA}} target="_blank" rel="noopener"><svg class="gp" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3.2v17.6c0 .5.6.8 1 .5l15-8.8c.4-.2.4-.8 0-1L5 2.7c-.4-.3-1 0-1 .5z" fill="currentColor"/></svg><span data-t="s3b"></span></a>
      </div>
    </li>
  </ol>
  <a class="btn ghost apps" data-press data-ripple href="https://motoraathailand.github.io/" data-apps><svg class="ai" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="apps"></span></a>
  <p class="pend" id="pend" data-t="pend"{{pendHidden}}></p>
  <p class="remind"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg><b data-t="remH"></b></p>
  <div class="all" id="all" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <div><b data-t="allT"></b><p data-t="allD"></p></div>
  </div>
</section>

<section class="wrap notes">
  <div class="ncard" data-reveal>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg>
    <div><h2 data-t="retryH"></h2><p data-t="retryD"></p><button type="button" class="btn ghost" id="reset" data-press data-ripple data-t="retryB"></button></div>
  </div>
</section>

<section class="wrap two">
  <div class="panel" data-reveal>
    <h2 data-t="shareH"></h2>
    <div class="row"><button class="btn ghost" type="button" id="share" data-press data-ripple><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="6" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="M8.2 10.9l7.1-3.7M8.2 13.1l7.1 3.7"/></svg><span data-t="share"></span></button></div>
    <p class="note" id="shareNote" aria-live="polite"></p>
  </div>
  <div class="panel qr" data-reveal style="--i:1">
    <h2 data-t="qrH"></h2>
    <img src="img/join-qr.svg" width="168" height="168" alt="" data-alt="qrAlt" loading="lazy">
    <p class="note" data-t="qrD"></p>
  </div>
</section>

<section class="wrap faq" aria-labelledby="faqH">
  <h2 id="faqH" data-reveal data-t="faqH"></h2>
  <div class="faqs" data-stagger>
    <details name="faq" open><summary data-t="q1"></summary><p data-t="a1"></p></details>
    <details name="faq"><summary data-t="q2"></summary><p data-t="a2"></p></details>
    <details name="faq"><summary data-t="q3"></summary><p data-t="a3"></p></details>
    <details name="faq"><summary data-t="q6"></summary><p><a href="mailto:{{contact}}" data-t="a6"></a></p></details>
  </div>
</section>
</main>

<footer class="ft"><div class="wrap"><a href="index.html" data-lnk data-t="back"></a><span aria-hidden="true">·</span><a href="privacy.html" data-lnk data-t="privacy"></a><span aria-hidden="true">·</span><span><span data-t="ftOp"></span>: MOTOR AA</span></div></footer>
